base_url = "https://awsd.fr"
title = "AWSD"
description = "AWSD est une société indépendante qui développe et maintient ses propres produits logiciels."
default_language = "fr"
theme = "atelier"

compile_sass = true
minify_html = true
build_search_index = false
generate_sitemap = true
generate_robots_txt = true

# Le site Hugo exposait ses flux RSS en index.xml : on garde le même nom
# (template themes/atelier/templates/index.xml).
generate_feeds = true
feed_filenames = ["index.xml"]

taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true },
]

[markdown]
smart_punctuation = false
external_links_target_blank = false
external_links_no_referrer = true
bottom_footnotes = true

[languages.en]
title = "AWSD"
description = "AWSD is an independent company that builds and maintains its own software products."
generate_feeds = true
feed_filenames = ["index.xml"]
taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true },
]

